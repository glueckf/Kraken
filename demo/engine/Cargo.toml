[package]
name = "kraken-demo-engine"
version = "0.1.0"
edition = "2021"
description = "Client-side all-push cost/latency scorer for the Kraken interactive demo (compiles to WASM)."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
